swagger: '2.0'
info:
  title: Bank Argent API documentation
  description: Contains all available API endpoints in this codebase
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
  - http
paths:
  /user/login:
    post:
      tags:
        - User Module
      summary: Login
      description: API for Login
      parameters:
        - in: body
          name: body
          description: Login Payload
          required: true
          schema:
            $ref: '#/definitions/Login'
      produces:
        - application/json
      responses:
        '200':
          description: Login Successfully
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/signup:
    post:
      tags:
        - User Module
      summary: Signup
      description: API for Signup
      parameters:
        - in: body
          name: body
          description: Signup Payload
          required: true
          schema:
            $ref: '#/definitions/User'
      produces:
        - application/json
      responses:
        '200':
          description: Signup Successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/profile:
    get:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for fetching a user profile
      #produces:
       # - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
    put:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for updating a user profile
      parameters:
        - in: body
          name: body
          description: Update user profile attributes
          required: true
          schema:
            $ref: '#/definitions/UserProfile'
      produces:
        - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /accounts:
    get:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: User accounts
      description: Returns all bank accounts of the authenticated user
      produces:
        - application/json
      responses:
        '200':
          description: Accounts retrieved successfully
          schema:
            $ref: '#/definitions/AccountsResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '500':
          description: Internal Server Error
  /accounts/{accountId}/transactions:
    get:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Account transactions
      description: Returns the transactions of a given account for a given month
      produces:
        - application/json
      parameters:
        - name: accountId
          in: path
          description: Account unique identifier
          required: true
          type: string
        - name: month
          in: query
          description: Month to retrieve, format YYYY-MM. Defaults to current month
          required: false
          type: string
      responses:
        '200':
          description: Transactions retrieved successfully
          schema:
            $ref: '#/definitions/TransactionsResponse'
        '400':
          description: Invalid month format
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Account does not belong to the user
        '404':
          description: Account not found
        '500':
          description: Internal Server Error
  /accounts/{accountId}/transactions/{transactionId}:
    get:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Transaction details
      description: Returns the full details of a single transaction
      produces:
        - application/json
      parameters:
        - name: accountId
          in: path
          description: Account unique identifier
          required: true
          type: string
        - name: transactionId
          in: path
          description: Transaction unique identifier
          required: true
          type: string
      responses:
        '200':
          description: Transaction retrieved successfully
          schema:
            $ref: '#/definitions/TransactionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Transaction does not belong to the user
        '404':
          description: Transaction not found
        '500':
          description: Internal Server Error
    patch:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Update transaction information
      description: >
        Updates the editable information of a transaction: category and note.
        Only the provided fields are modified. Sending null clears a field.
        Date, description, amount and balance cannot be modified.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: accountId
          in: path
          description: Account unique identifier
          required: true
          type: string
        - name: transactionId
          in: path
          description: Transaction unique identifier
          required: true
          type: string
        - in: body
          name: body
          description: Fields to update
          required: true
          schema:
            $ref: '#/definitions/TransactionUpdate'
      responses:
        '200':
          description: Transaction updated successfully
          schema:
            $ref: '#/definitions/TransactionResponse'
        '400':
          description: Invalid Fields
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Transaction does not belong to the user
        '404':
          description: Transaction not found
        '500':
          description: Internal Server Error
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
definitions:
  User:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
      firstName:
        type: string
        description: user first name
      lastName:
        type: string
        description: user last name
      userName:
        type: string
        description: user public name
  Login:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
  ApiResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body:
        type: object
        properties:
          id:
            type: string
          email:
            type: string
  LoginResponse:
    type: object
    properties:
      token:
        type: string
  UserProfile:
    type: object
    properties:
      userName:
        type: string
  Account:
    type: object
    properties:
      id:
        type: string
        description: Account unique identifier
      title:
        type: string
        description: Account name, e.g. Argent Bank Checking (x8349)
      balance:
        type: number
        format: double
        description: Current account balance
      balanceType:
        type: string
        description: Available Balance or Current Balance
      currency:
        type: string
        description: ISO 4217 currency code, e.g. USD
  AccountsResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body:
        type: array
        items:
          $ref: '#/definitions/Account'
  Transaction:
    type: object
    properties:
      id:
        type: string
        description: Transaction unique identifier
      date:
        type: string
        format: date-time
      description:
        type: string
        description: Merchant or operation label
      amount:
        type: number
        format: double
      balance:
        type: number
        format: double
        description: Account balance after the transaction
  TransactionDetail:
    type: object
    properties:
      id:
        type: string
      date:
        type: string
        format: date-time
      description:
        type: string
      amount:
        type: number
        format: double
      balance:
        type: number
        format: double
      transactionType:
        type: string
        description: Read-only, e.g. Electronic
      category:
        type: string
        description: Editable
      note:
        type: string
        description: Editable
  TransactionsResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body:
        type: array
        items:
          $ref: '#/definitions/Transaction'
  TransactionResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body:
        $ref: '#/definitions/TransactionDetail'
  TransactionUpdate:
    type: object
    properties:
      category:
        type: string
        description: New category. Null clears the field
      note:
        type: string
        description: New note. Null clears the field
